# algorithm
max_iter: 2
num_search: 1000
num_pool: 1000
num_filter_pair: 200000
num_filter_mol: 1000
num_mutate_mol: 100
topk: 1000
use_stereo: False
optional_halogens: ['F', 'Cl', 'Br', 'I']
max_cycle_length: 6
invalid_patterns: ['[O][O]', '[R]=[R]=[R]', '[r3,r4]=[r3,r4]', '[O][F,Cl,Br,I]']
sigma_h: 1
sigma_c: 10
use_H_split: False
split_coef: 0.8
include_active_hs: 'yes'
# exp
data_path: "./data/demo/test.lmdb"
nmr_type: 'HC'
use_elements: True
# Scene Adaptation Module: Enable/disable reactant/candidate integration
# 场景适配模块：启用/禁用反应物/候选分子集成
# When enabled, reactant molecules specified in the input data will be
# incorporated into the candidate structure pool, allowing their substructures
# to be utilized during fragment-based molecular optimization.
# 启用后，输入数据中指定的反应物分子将被纳入候选结构池，
# 允许在基于片段的分子优化过程中利用它们的子结构。
use_candidates: False
# debug
plot_result: 10
enable_logger: True
